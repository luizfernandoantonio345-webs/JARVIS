<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS v5.2 — Neural Core Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(20, 30, 50, 0.9);
            border: 2px solid #00d4ff;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        .header {
            background: linear-gradient(90deg, #0f4c75 0%, #00d4ff 100%);
            padding: 25px;
            text-align: center;
            border-bottom: 2px solid #00d4ff;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid #00d4ff;
            font-size: 0.9em;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.online {
            background: #00ff00;
        }

        .status-dot.offline {
            background: #ff3333;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: #0f4c75;
            border: 1px solid #00d4ff;
        }

        .message.system {
            align-self: flex-start;
            background: rgba(0, 212, 255, 0.1);
            border-left: 3px solid #00d4ff;
        }

        .message.thinking {
            align-self: flex-start;
            background: rgba(255, 200, 0, 0.1);
            border-left: 3px solid #ffc800;
            font-style: italic;
        }

        .message.error {
            align-self: flex-start;
            background: rgba(255, 50, 50, 0.1);
            border-left: 3px solid #ff3333;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 20px;
            border-top: 2px solid #00d4ff;
            background: rgba(0, 0, 0, 0.2);
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #00d4ff;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1em;
        }

        input[type="text"]::placeholder {
            color: #999;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        button {
            padding: 12px 25px;
            background: linear-gradient(90deg, #00d4ff 0%, #0f4c75 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
        }

        button:hover {
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .mic-button {
            background: linear-gradient(90deg, #ff6b6b 0%, #ff3333 100%);
        }

        .mic-button:hover {
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.6);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: #00d4ff;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00ff00;
        }

        .footer {
            padding: 10px 20px;
            text-align: center;
            font-size: 0.85em;
            border-top: 1px solid #00d4ff;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 JARVIS v5.2</h1>
            <p>Neural Core Interface</p>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot online" id="serverStatus"></div>
                <span>Servidor: <span id="serverStatusText">Conectando...</span></span>
            </div>
            <div class="status-item">
                <div class="status-dot offline" id="voiceStatus"></div>
                <span>Voz: <span id="voiceStatusText">Pronta</span></span>
            </div>
            <div class="status-item">
                <div id="uptime" style="font-size: 0.9em;">Tempo de execução: 00:00:00</div>
            </div>
        </div>

        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="message system">
                    📡 Conectando ao núcleo JARVIS...
                </div>
            </div>

            <div class="input-area">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Digite sua mensagem ou pressione Enter..." 
                    disabled
                >
                <button id="sendButton" onclick="sendMessage()" disabled>Enviar</button>
                <button class="mic-button" id="voiceButton" onclick="toggleVoice()" disabled>🎤 Voz</button>
            </div>
        </div>

        <div class="footer">
            JARVIS v5.2 | Connected to ws://localhost:8000/ws/jarvis | Python 3.11 + FastAPI
        </div>
    </div>

    <script>
        const WS_URL = 'ws://localhost:8000/ws/jarvis';
        let ws = null;
        let isConnected = false;
        let startTime = Date.now();
        let voiceActive = false;

        function formatUptime(ms) {
            const seconds = Math.floor(ms / 1000) % 60;
            const minutes = Math.floor(ms / 60000) % 60;
            const hours = Math.floor(ms / 3600000);
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function updateUptime() {
            const elapsed = Date.now() - startTime;
            document.getElementById('uptime').textContent = `Tempo de execução: ${formatUptime(elapsed)}`;
        }

        function addMessage(text, type = 'system') {
            const messagesDiv = document.getElementById('messages');
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            messagesDiv.appendChild(message);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function connectWebSocket() {
            try {
                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    console.log('WebSocket conectado');
                    isConnected = true;
                    document.getElementById('serverStatus').classList.add('online');
                    document.getElementById('serverStatusText').textContent = 'Online';
                    document.getElementById('messageInput').disabled = false;
                    document.getElementById('sendButton').disabled = false;
                    document.getElementById('voiceButton').disabled = false;
                    addMessage('✅ Conectado ao núcleo JARVIS. Pronto para receber comandos.');
                };

                ws.onmessage = (event) => {
                    console.log('Mensagem recebida:', event.data);
                    try {
                        const data = JSON.parse(event.data);
                        if (data.status === 'thinking') {
                            addMessage('💭 ' + (data.message || 'Processando...'), 'thinking');
                        } else if (data.status === 'speaking') {
                            addMessage('🗣️ ' + (data.message || 'Respondendo...'), 'system');
                        } else if (data.status === 'error') {
                            addMessage('❌ Erro: ' + (data.message || 'Erro desconhecido'), 'error');
                        } else {
                            addMessage(data.message || event.data, 'system');
                        }
                    } catch (e) {
                        addMessage(event.data, 'system');
                    }
                };

                ws.onerror = (error) => {
                    console.error('WebSocket erro:', error);
                    addMessage('❌ Erro de conexão WebSocket', 'error');
                    document.getElementById('serverStatus').classList.remove('online');
                    document.getElementById('serverStatusText').textContent = 'Erro';
                };

                ws.onclose = () => {
                    console.log('WebSocket desconectado');
                    isConnected = false;
                    document.getElementById('messageInput').disabled = true;
                    document.getElementById('sendButton').disabled = true;
                    document.getElementById('voiceButton').disabled = true;
                    document.getElementById('serverStatus').classList.remove('online');
                    document.getElementById('serverStatusText').textContent = 'Offline';
                    addMessage('⚠️ Desconectado. Reconectando em 3 segundos...', 'error');
                    setTimeout(connectWebSocket, 3000);
                };
            } catch (error) {
                console.error('Erro ao conectar:', error);
                addMessage('❌ Falha ao conectar ao servidor', 'error');
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;
            if (!isConnected) {
                addMessage('⚠️ Não conectado ao servidor', 'error');
                return;
            }

            addMessage(message, 'user');
            input.value = '';

            try {
                ws.send(message);
            } catch (error) {
                console.error('Erro ao enviar:', error);
                addMessage('❌ Erro ao enviar mensagem', 'error');
            }
        }

        function toggleVoice() {
            voiceActive = !voiceActive;
            const btn = document.getElementById('voiceButton');
            const status = document.getElementById('voiceStatusText');
            
            if (voiceActive) {
                btn.style.opacity = '0.7';
                status.textContent = 'Escutando...';
                addMessage('🎤 Modo voz ativado. Pode falar agora.', 'thinking');
            } else {
                btn.style.opacity = '1';
                status.textContent = 'Pronta';
                addMessage('🎤 Modo voz desativado.', 'system');
            }
        }

        // Event listeners
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Iniciar
        window.addEventListener('load', () => {
            connectWebSocket();
            setInterval(updateUptime, 1000);
        });
    </script>
</body>
</html>
