version: '3.9'

services:
  # ===========================================================================
  # JARVIS Backend API
  # ===========================================================================
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-backend
    ports:
      - "8000:8000"
    environment:
      - JARVIS_OLLAMA_URL=http://ollama:11434
      - JARVIS_PORT=8000
      - JARVIS_HOST=0.0.0.0
      - JARVIS_DISABLE_VOICE=1
      - JARVIS_LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app/backend
      - ./backend/logs:/app/backend/logs
      - ./jobs:/app/jobs
    depends_on:
      - ollama
    networks:
      - jarvis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ===========================================================================
  # Ollama — Local LLM Service
  # ===========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: jarvis-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - jarvis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ===========================================================================
  # PostgreSQL — Optional: Future database backend
