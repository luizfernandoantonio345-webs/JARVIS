name: Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Scan with bandit
      run: |
        bandit -r backend/ \
          -f json \
          -o bandit-report.json \
          || true
      continue-on-error: true

    - name: Check dependencies with safety
      run: |
        safety check \
          --json \
          --output safety-report.json \
          || true
      continue-on-error: true

    - name: Parse bandit results
      if: always()
      run: |
        if [ -f bandit-report.json ]; then
          echo "## Security Scan Results (Bandit)" > security_report.md
          python -c "import json; data=json.load(open('bandit-report.json')); print(f'Found {len(data.get(\"results\", []))} issues')" >> security_report.md
        fi

    - name: Upload security report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: bandit-report.json

    - name: Create security summary
      if: always()
      run: |
        echo "## Security Checks Completed" > security_summary.md
        echo "" >> security_summary.md
        echo "- Bandit: Static security analysis" >> security_summary.md
        echo "- Safety: Dependency vulnerability check" >> security_summary.md
        echo "" >> security_summary.md
        echo "Review detailed reports in artifacts." >> security_summary.md

    - name: Comment PR with security summary
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('security_summary.md', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });
      continue-on-error: true
