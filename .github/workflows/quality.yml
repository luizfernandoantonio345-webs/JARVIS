name: Code Quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 pylint mypy

    - name: Format check with black
      run: black --check backend/
      continue-on-error: true

    - name: Sort imports with isort
      run: isort --check-only --diff backend/
      continue-on-error: true

    - name: Lint with pylint
      run: pylint backend/ --fail-under=8.0 || true
      continue-on-error: true

    - name: Lint with flake8
      run: |
        flake8 backend/ \
          --count \
          --statistics \
          --max-line-length=120 \
          --exclude=.git,__pycache__,.venv
      continue-on-error: true

    - name: Type check with mypy
      run: mypy backend/ --ignore-missing-imports --no-error-summary || true
      continue-on-error: true

    - name: Create quality report
      if: always()
      run: |
        echo "## Code Quality Report" > quality_report.md
        echo "" >> quality_report.md
        echo "### Status" >> quality_report.md
        echo "- Black formatting: Checked" >> quality_report.md
        echo "- Import sorting: Checked" >> quality_report.md
        echo "- Pylint: Checked" >> quality_report.md
        echo "- Flake8: Checked" >> quality_report.md
        echo "- MyPy types: Checked" >> quality_report.md

    - name: Upload quality report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quality-report
        path: quality_report.md
