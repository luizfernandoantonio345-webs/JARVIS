name: Build Check

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Test imports
      run: |
        python -c "from backend.main import app; print('✓ Main imports OK')"
        python -c "from backend.config import get_config; print('✓ Config imports OK')"
        python -c "from backend.routes import *; print('✓ Routes imports OK')"
        python -c "from backend.core import *; print('✓ Core imports OK')"
        python -c "from backend.actions import *; print('✓ Actions imports OK')"
      env:
        JARVIS_DISABLE_VOICE: 1

    - name: Verify structure
      run: |
        python -c "
        import os
        required_dirs = ['backend/routes', 'backend/core', 'backend/actions', 'backend/agents']
        for d in required_dirs:
            if not os.path.isdir(d):
                raise FileNotFoundError(f'{d} not found')
        print('✓ All required directories present')
        "

    - name: Check for syntax errors
      run: |
        python -m py_compile backend/**/*.py || true

    - name: Build status
      run: |
        echo "Build check PASSED"
        echo "All imports: OK"
        echo "Directory structure: OK"
        echo "Syntax: OK"
