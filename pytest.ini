[pytest]
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --no-header
    -q
    -m "not integration"

markers =
    integration: testes E2E que requerem o servidor rodando em localhost:8000

[tool:pytest]
asyncio_mode = auto
