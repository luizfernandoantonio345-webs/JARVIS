<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. v6.0 - Stark Industries</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #4eff91;
            overflow: hidden;
            height: 100vh;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            gap: 20px;
        }
        
        /* Header */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #4eff91;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }
        
        #jt {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 20px #4eff91;
            animation: pulse-glow 2s ease-in-out infinite;
        }
        
        @keyframes pulse-glow {
            0%, 100% { text-shadow: 0 0 20px #4eff91; }
            50% { text-shadow: 0 0 40px #4eff91, 0 0 60px rgba(78,255,145,0.5); }
        }
        
        .header-right {
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 12px;
        }
        
        #stlive {
            padding: 8px 12px;
            background: rgba(78,255,145,0.1);
            border: 1px solid #4eff91;
            border-radius: 4px;
            animation: status-pulse 1s ease-in-out infinite;
        }
        
        @keyframes status-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        #jver {
            color: #888;
            font-size: 11px;
        }
        
        /* Orb */
        #orb-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            min-height: 200px;
            position: relative;
        }
        
        #loring {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 3px solid #4eff91;
            position: relative;
            background: radial-gradient(circle at 30% 30%, rgba(78,255,145,0.1), transparent);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #jt-inner {
            font-size: 48px;
            text-align: center;
            user-select: none;
        }
        
        /* Listening animation */
        @keyframes wave {
            0% { transform: scaleY(1); }
            50% { transform: scaleY(1.3); }
            100% { transform: scaleY(1); }
        }
        
        .wave-bar {
            width: 4px;
            height: 40px;
            background: #4eff91;
            border-radius: 2px;
            position: absolute;
            bottom: 50%;
            transform-origin: bottom;
        }
        
        #loring.on .wave-bar {
            animation: wave 0.6s ease-in-out infinite;
        }
        
        .wave-bar:nth-child(1) { left: 20px; animation-delay: 0s; }
        .wave-bar:nth-child(2) { left: 35px; animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { left: 50px; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { left: 65px; animation-delay: 0.1s; }
        .wave-bar:nth-child(5) { left: 80px; animation-delay: 0s; }
        
        /* Response Area */
        #response-area {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #4eff91;
            border-radius: 8px;
            padding: 20px;
            height: 150px;
            overflow-y: auto;
            display: none;
            backdrop-filter: blur(10px);
        }
        
        #response-area.show {
            display: block;
            animation: slide-up 0.3s ease-out;
        }
        
        @keyframes slide-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        #response-text {
            font-size: 14px;
            line-height: 1.5;
            color: #4eff91;
        }
        
        /* Input Section */
        #cmd-input {
            display: flex;
            gap: 10px;
        }
        
        #cmdText {
            flex: 1;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #4eff91;
            border-radius: 4px;
            padding: 12px 15px;
            color: #4eff91;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }
        
        #cmdText:focus {
            box-shadow: 0 0 15px rgba(78,255,145,0.3);
            border-color: #7fff9f;
        }
        
        #cmdText::placeholder {
            color: #4eff9155;
        }
        
        button {
            padding: 12px 20px;
            background: rgba(78,255,145,0.1);
            border: 1px solid #4eff91;
            border-radius: 4px;
            color: #4eff91;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        button:hover {
            background: rgba(78,255,145,0.2);
            box-shadow: 0 0 15px rgba(78,255,145,0.3);
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        /* Status Indicator */
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: blink 1s ease-in-out infinite;
        }
        
        .status-indicator.online { background: #4eff91; }
        .status-indicator.degraded { background: #ffaa00; }
        .status-indicator.offline { background: #ff4444; }
        
        /* History */
        .history-item {
            padding: 8px 12px;
            background: rgba(78,255,145,0.05);
            border-left: 2px solid #4eff91;
            margin-bottom: 5px;
            font-size: 12px;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .history-item:hover {
            background: rgba(78,255,145,0.15);
            padding-left: 16px;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #4eff91;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #7fff9f;
        }
        
        /* Particles */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #4eff91;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div id="header">
            <div id="jt">J.A.R.V.I.S.</div>
            <div class="header-right">
                <div id="stlive">
                    <span class="status-indicator online"></span>ONLINE
                </div>
                <div id="jver">v6.0 | Stark Industries</div>
            </div>
        </div>
        
        <!-- Orb -->
        <div id="orb-container">
            <div id="loring">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div id="jt-inner">
                    <span style="font-size: 64px;">*</span>
                </div>
            </div>
        </div>
        
        <!-- Response -->
        <div id="response-area">
            <div id="response-text"></div>
        </div>
        
        <!-- Input -->
        <div id="cmd-input">
            <input type="text" id="cmdText" placeholder="Speak your command, Sir...">
            <button id="sendBtn">SEND</button>
            <button id="voiceBtn">🎤</button>
        </div>
    </div>
    
    <script>
        // =====================================================================
        // JARVIS v6.0 — Enhanced Frontend
        // All 20 improvements implemented
        // =====================================================================
        
        const API = `http://${window.location.hostname}:8000`;
        const WS_URL = `ws://${window.location.hostname}:8000/ws/jarvis`;
        
        let ws = null;
        let isStream = false;
        let streamBuf = '';
        let speaking = false;
        let _ttsPlaying = false;
        let _wsRetries = 0;
        const _wsMaxRetries = 10;
        const _wsBaseDelay = 1000;
        
        let cmdHistory = [];
        let cmdHistIdx = -1;
        
        // ==================== WEBSOCKET ====================
        function connectWS() {
            try {
                ws = new WebSocket(WS_URL);
                
                ws.onopen = () => {
                    _wsRetries = 0;
                    console.log('[JARVIS] WS connected');
                    setStatus('ONLINE');
                };
                
                ws.onmessage = (evt) => {
                    try {
                        const m = JSON.parse(evt.data);
                        
                        // Ignore heartbeats
                        if (m.type === 'pong' || m.type === 'ping') return;
                        
                        // Token streaming
                        if (m.type === 'token') {
                            if (!isStream) {
                                isStream = true;
                                streamBuf = '';
                                showAll();
                                setSpeaking(true);
                            }
                            streamBuf += m.content;
                            updateResponse(streamBuf);
                        }
                        
                        // Response complete
                        if (m.type === 'done') {
                            isStream = false;
                            const txt = m.full_response || streamBuf;
                            updateResponse(txt);
                            playTTS(txt);
                            setTimeout(() => setSpeaking(false), 3500);
                        }
                        
                        // Error
                        if (m.type === 'error') {
                            isStream = false;
                            updateResponse('Error: ' + (m.detail || 'Unknown'));
                            setSpeaking(false);
                            setAlert(true);
                        }
                        
                        // Status changes
                        if (m.status === 'thinking') {
                            showAll();
                            setSpeaking(true);
                            updateResponse('Processing...');
                        }
                        if (m.status === 'idle') {
                            setSpeaking(false);
                        }
                        
                        // Voice state
                        if (m.event === 'voice_state') {
                            if (m.state === 'SPEAKING' || m.state === 'LISTENING') {
                                setSpeaking(true);
                                showAll();
                            }
                            if (m.state === 'IDLE') setSpeaking(false);
                        }
                    } catch (e) {
                        console.error('[WS] Parse error:', e);
                    }
                };
                
                ws.onerror = () => {
                    console.error('[WS] Error');
                };
                
                ws.onclose = () => {
                    ws = null;
                    if (_wsRetries < _wsMaxRetries) {
                        const delay = Math.min(_wsBaseDelay * Math.pow(2, _wsRetries), 30000);
                        _wsRetries++;
                        console.warn(`[WS] Closed. Retry ${_wsRetries} in ${delay}ms`);
                        setStatus(`RECONNECTING (${_wsRetries}/${_wsMaxRetries})`);
                        setTimeout(connectWS, delay);
                    } else {
                        setStatus('OFFLINE');
                    }
                };
            } catch (e) {
                console.error('[WS] Error:', e);
            }
        }
        
        // ==================== UI FUNCTIONS ====================
        function updateResponse(text) {
            const rt = document.getElementById('response-text');
            const ra = document.getElementById('response-area');
            if (rt) {
                rt.textContent = text;
                if (ra) {
                    ra.classList.add('show');
                    ra.scrollTop = ra.scrollHeight;
                }
            }
        }
        
        function showAll() {
            document.getElementById('response-area').classList.add('show');
        }
        
        function hideResponse() {
            document.getElementById('response-area').classList.remove('show');
        }
        
        function setSpeaking(on) {
            speaking = on;
            const loring = document.getElementById('loring');
            const jt = document.getElementById('jt');
            if (on) {
                loring?.classList.add('on');
                if (jt) jt.style.textShadow = '0 0 40px #4eff91, 0 0 80px rgba(78,255,145,0.5)';
            } else {
                loring?.classList.remove('on');
                if (jt) jt.style.textShadow = '0 0 20px #4eff91';
            }
        }
        
        function setStatus(status) {
            const el = document.getElementById('stlive');
            if (el) {
                if (status === 'ONLINE') {
                    el.innerHTML = '<span class="status-indicator online"></span>ONLINE';
                } else if (status.includes('RECONNECT')) {
                    el.innerHTML = '<span class="status-indicator degraded"></span>' + status;
                } else if (status === 'OFFLINE') {
                    el.innerHTML = '<span class="status-indicator offline"></span>OFFLINE';
                }
            }
        }
        
        function setAlert(on) {
            const header = document.getElementById('header');
            if (on) {
                header?.style.borderColor = '#ff4444';
                setTimeout(() => {
                    header?.style.borderColor = '#4eff91';
                }, 5000);
            }
        }
        
        function playTTS(text) {
            if (!text || _ttsPlaying) return;
            _ttsPlaying = true;
            
            const url = `${API}/tts-iron/tts?text=${encodeURIComponent(text.slice(0, 300))}`;
            const audio = new Audio(url);
            
            audio.onplay = () => setSpeaking(true);
            audio.onended = () => {
                _ttsPlaying = false;
                setSpeaking(false);
            };
            
            audio.onerror = () => {
                _ttsPlaying = false;
                // Fallback to Web Speech API
                try {
                    const u = new SpeechSynthesisUtterance(text.slice(0, 200));
                    u.lang = 'en-GB';
                    u.rate = 0.9;
                    u.pitch = 0.85;
                    u.onend = () => setSpeaking(false);
                    window.speechSynthesis.speak(u);
                } catch (e) {
                    setSpeaking(false);
                }
            };
            
            audio.play().catch(() => {
                _ttsPlaying = false;
            });
        }
        
        // ==================== COMMANDS ====================
        async function runCmd(cmd) {
            if (!ws) {
                updateResponse('Not connected to JARVIS.');
                return;
            }
            
            try {
                ws.send(JSON.stringify({
                    type: 'command',
                    content: cmd,
                    session_id: 'web-session'
                }));
            } catch (e) {
                console.error('[CMD] Send failed:', e);
                updateResponse('Command failed.');
            }
        }
        
        // ==================== KEYBOARD ====================
        document.getElementById('cmdText').addEventListener('keydown', (e) => {
            // Arrow up/down for history
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (cmdHistIdx < cmdHistory.length - 1) {
                    cmdHistIdx++;
                    e.target.value = cmdHistory[cmdHistIdx] || '';
                }
            }
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (cmdHistIdx > 0) {
                    cmdHistIdx--;
                    e.target.value = cmdHistory[cmdHistIdx] || '';
                } else {
                    cmdHistIdx = -1;
                    e.target.value = '';
                }
            }
            
            // Enter to send
            if (e.key === 'Enter') {
                const cmd = e.target.value.trim();
                if (cmd) {
                    cmdHistory.unshift(cmd);
                    if (cmdHistory.length > 50) cmdHistory.pop();
                    cmdHistIdx = -1;
                    runCmd(cmd);
                    e.target.value = '';
                }
            }
        });
        
        document.getElementById('sendBtn').addEventListener('click', () => {
            const cmd = document.getElementById('cmdText').value.trim();
            if (cmd) {
                cmdHistory.unshift(cmd);
                if (cmdHistory.length > 50) cmdHistory.pop();
                cmdHistIdx = -1;
                runCmd(cmd);
                document.getElementById('cmdText').value = '';
            }
        });
        
        // ==================== STARTUP ====================
        window.addEventListener('load', () => {
            connectWS();
            
            // Update status periodically
            setInterval(async () => {
                try {
                    const r = await fetch(`${API}/status`, { cache: 'no-store' });
                    const d = await r.json();
                    if (d.ollama_connected) {
                        setStatus('ONLINE');
                    } else {
                        setStatus('DEGRADED');
                    }
                } catch (e) {
                    // Already offline
                }
            }, 15000);
        });
    </script>
</body>
</html>
