<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS v5.2 — Neural Core Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(20, 30, 50, 0.9);
            border: 2px solid #00d4ff;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        .header {
            background: linear-gradient(90deg, #0f4c75 0%, #00d4ff 100%);
            padding: 25px;
            text-align: center;
            border-bottom: 2px solid #00d4ff;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid #00d4ff;
            font-size: 0.9em;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.online {
            background: #00ff00;
        }

        .status-dot.offline {
            background: #ff3333;
        }

        .status-dot.reconnecting {
            background: #ffaa00;
            animation: pulse-warning 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes pulse-warning {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 0.3; }
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
            animation: slideIn 0.3s ease-out;
            font-size: 0.95em;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: #0f4c75;
            border: 1px solid #00d4ff;
        }

        .message.system {
            align-self: flex-start;
            background: rgba(0, 212, 255, 0.1);
            border-left: 3px solid #00d4ff;
        }

        .message.thinking {
            align-self: flex-start;
            background: rgba(255, 200, 0, 0.1);
            border-left: 3px solid #ffc800;
            font-style: italic;
        }

        .message.error {
            align-self: flex-start;
            background: rgba(255, 50, 50, 0.1);
            border-left: 3px solid #ff3333;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 20px;
            border-top: 2px solid #00d4ff;
            background: rgba(0, 0, 0, 0.2);
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #00d4ff;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1em;
        }

        input[type="text"]::placeholder {
            color: #999;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        button {
            padding: 12px 25px;
            background: linear-gradient(90deg, #00d4ff 0%, #0f4c75 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
            white-space: nowrap;
        }

        button:hover:not(:disabled) {
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .mic-button {
            background: linear-gradient(90deg, #ff6b6b 0%, #ff3333 100%);
        }

        .mic-button:hover:not(:disabled) {
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.6);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: #00d4ff;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00ff00;
        }

        .footer {
            padding: 10px 20px;
            text-align: center;
            font-size: 0.85em;
            border-top: 1px solid #00d4ff;
            color: #999;
        }

        @media (max-width: 768px) {
            .container {
                max-width: 100%;
                height: 100vh;
            }

            .message {
                max-width: 90%;
            }

            .status-bar {
                flex-direction: column;
                gap: 5px;
            }

            .input-area {
                flex-direction: column;
            }

            input[type="text"] {
                min-width: 100%;
            }

            button {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 JARVIS v5.2</h1>
            <p>Neural Core Interface</p>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot online" id="serverStatus"></div>
                <span>Servidor: <span id="serverStatusText">Conectando...</span></span>
            </div>
            <div class="status-item">
                <div class="status-dot offline" id="voiceStatus"></div>
                <span>Voz: <span id="voiceStatusText">Pronta</span></span>
            </div>
            <div class="status-item">
                <div id="uptime" style="font-size: 0.9em;">Tempo: 00:00:00</div>
            </div>
        </div>

        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="message system">
                    📡 Conectando ao núcleo JARVIS...
                </div>
            </div>

            <div class="input-area">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Digite sua mensagem ou pressione Enter..."
                    disabled
                >
                <button id="sendButton" onclick="sendMessage()" disabled>Enviar</button>
                <button class="mic-button" id="voiceButton" onclick="toggleVoice()" disabled>🎤 Voz</button>
            </div>
        </div>

        <div class="footer">
            JARVIS v5.2 | Python 3.11 + FastAPI | Heartbeat + Auto-reconnect enabled
        </div>
    </div>

    <script>
        const WS_URL = `ws://${window.location.host}/ws/jarvis`;
        const RECONNECT_INTERVAL = 3000;
        const RECONNECT_MAX_ATTEMPTS = 10;
        const HEARTBEAT_TIMEOUT = 60000;

        let ws = null;
        let isConnected = false;
        let isReconnecting = false;
        let reconnectAttempts = 0;
        let startTime = Date.now();
        let voiceActive = false;
        let lastHeartbeatTime = Date.now();
        let heartbeatTimeoutHandle = null;
        let messageQueue = [];

        function formatUptime(ms) {
            const seconds = Math.floor(ms / 1000) % 60;
            const minutes = Math.floor(ms / 60000) % 60;
            const hours = Math.floor(ms / 3600000);
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function updateUptime() {
            const elapsed = Date.now() - startTime;
            document.getElementById('uptime').textContent = `Tempo: ${formatUptime(elapsed)}`;
        }

        function addMessage(text, type = 'system') {
            const messagesDiv = document.getElementById('messages');
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            messagesDiv.appendChild(message);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function connectWebSocket() {
            if (isReconnecting && reconnectAttempts >= RECONNECT_MAX_ATTEMPTS) {
                addMessage('❌ Falha ao reconectar após múltiplas tentativas', 'error');
                document.getElementById('serverStatus').classList.remove('online');
                document.getElementById('serverStatus').classList.add('offline');
                document.getElementById('serverStatusText').textContent = 'Offline';
                return;
            }

            if (isReconnecting) {
                document.getElementById('serverStatus').classList.add('reconnecting');
                document.getElementById('serverStatusText').textContent = `Reconectando (${reconnectAttempts}/${RECONNECT_MAX_ATTEMPTS})...`;
            }

            try {
                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    console.log('WebSocket conectado');
                    isConnected = true;
                    isReconnecting = false;
                    reconnectAttempts = 0;

                    document.getElementById('serverStatus').classList.remove('offline', 'reconnecting');
                    document.getElementById('serverStatus').classList.add('online');
                    document.getElementById('serverStatusText').textContent = 'Online';
                    document.getElementById('messageInput').disabled = false;
                    document.getElementById('sendButton').disabled = false;
                    document.getElementById('voiceButton').disabled = false;

                    lastHeartbeatTime = Date.now();
                    startHeartbeatTimeout();

                    addMessage('✅ Conectado ao núcleo JARVIS. Pronto para receber comandos.');

                    while (messageQueue.length > 0) {
                        const msg = messageQueue.shift();
                        ws.send(msg);
                    }
                };

                ws.onmessage = (event) => {
                    console.log('Mensagem:', event.data.substring(0, 50));
                    try {
                        const data = JSON.parse(event.data);

                        // Silently handle keepalive/control messages
                        if (data.type === 'ping' || data.type === 'pong' || data.type === 'heartbeat') {
                            lastHeartbeatTime = Date.now();
                            resetHeartbeatTimeout();
                            return;
                        }

                        // Skip non-displayable internal events
                        if (data.type === 'agent' || data.type === 'token') return;

                        const type = data.type;
                        const status = data.status;

                        if (type === 'thinking' || status === 'thinking') {
                            addMessage('💭 ' + (data.message || 'Processando...'), 'thinking');
                        } else if (type === 'done') {
                            const text = data.full_response || data.response || data.message;
                            if (text) addMessage('🗣️ ' + text, 'system');
                        } else if (status === 'speaking') {
                            addMessage('🗣️ ' + (data.message || 'Respondendo...'), 'system');
                        } else if (type === 'error' || status === 'error') {
                            addMessage('❌ Erro: ' + (data.message || data.detail || 'Erro desconhecido'), 'error');
                        } else if (status === 'idle' || type === 'idle') {
                            addMessage('✅ ' + (data.message || 'JARVIS online.'), 'system');
                        } else {
                            const message = data.message || data.content || data.response;
                            if (message) addMessage(message, 'system');
                        }
                    } catch (e) {
                        console.warn('Parse error:', e);
                        addMessage(event.data, 'system');
                    }
                };

                ws.onerror = (error) => {
                    console.error('WebSocket erro:', error);
                    addMessage('❌ Erro de conexão WebSocket', 'error');
                };

                ws.onclose = () => {
                    console.log('WebSocket desconectado');
                    isConnected = false;
                    document.getElementById('messageInput').disabled = true;
                    document.getElementById('sendButton').disabled = true;
                    document.getElementById('voiceButton').disabled = true;
                    document.getElementById('serverStatus').classList.remove('online');
                    document.getElementById('serverStatusText').textContent = 'Offline';

                    isReconnecting = true;
                    reconnectAttempts++;
                    addMessage(`⚠️ Desconectado. Tentando reconectar (${reconnectAttempts}/${RECONNECT_MAX_ATTEMPTS})...`, 'error');
                    setTimeout(connectWebSocket, RECONNECT_INTERVAL);
                };
            } catch (error) {
                console.error('Erro ao conectar:', error);
                addMessage('❌ Falha ao conectar ao servidor', 'error');
            }
        }

        function startHeartbeatTimeout() {
            if (heartbeatTimeoutHandle) {
                clearTimeout(heartbeatTimeoutHandle);
            }
            heartbeatTimeoutHandle = setTimeout(() => {
                console.warn('Heartbeat timeout');
                if (ws) ws.close();
                isConnected = false;
                connectWebSocket();
            }, HEARTBEAT_TIMEOUT);
        }

        function resetHeartbeatTimeout() {
            if (heartbeatTimeoutHandle) {
                clearTimeout(heartbeatTimeoutHandle);
            }
            startHeartbeatTimeout();
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            if (!isConnected) {
                addMessage('⚠️ Não conectado ao servidor', 'error');
                messageQueue.push(message);
                return;
            }

            addMessage(message, 'user');
            input.value = '';

            try {
                ws.send(message);
            } catch (error) {
                console.error('Erro ao enviar:', error);
                addMessage('❌ Erro ao enviar mensagem', 'error');
                messageQueue.push(message);
            }
        }

        function toggleVoice() {
            voiceActive = !voiceActive;
            const btn = document.getElementById('voiceButton');
            const status = document.getElementById('voiceStatusText');

            if (voiceActive) {
                btn.style.opacity = '0.7';
                status.textContent = 'Escutando...';
                addMessage('🎤 Modo voz ativado. Pode falar agora.', 'thinking');
            } else {
                btn.style.opacity = '1';
                status.textContent = 'Pronta';
                addMessage('🎤 Modo voz desativado.', 'system');
            }
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        window.addEventListener('load', () => {
            connectWebSocket();
            setInterval(updateUptime, 1000);
            console.log('JARVIS Dashboard v5.2 inicializado');
            console.log('WebSocket:', WS_URL);
        });

        window.addEventListener('beforeunload', () => {
            if (ws) ws.close();
        });
    </script>
</body>
</html>
